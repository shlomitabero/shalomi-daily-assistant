services:
  - type: web
    name: forge-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Pinned to an exact version Render's build resolver is confirmed to
      # have, not a loose range -- Render's own docs warn an unbounded
      # range (e.g. >=18) can silently pick up an unexpected release, and
      # a specific old pinned patch can likewise stop being offered by
      # Render's build image over time, breaking every subsequent deploy
      # identically until the pin is updated. This exact version is the
      # one this project's own build/test/boot cycle was just verified
      # against end to end.
      - key: NODE_VERSION
        value: 22.22.0
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: set this (Resend's API key, from resend.com) to turn on
      # the extra email-login-code step on top of the password -- see
      # apps/api/src/email.ts. Login works exactly as before if this is
      # left unset.
      - key: RESEND_API_KEY
        sync: false
      # Optional: defaults to Resend's own test sender if left unset, which
      # needs no domain verification. Only worth setting once a real
      # sending domain has been verified in the Resend dashboard.
      - key: RESEND_FROM_EMAIL
        sync: false
