<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Round 1943: no favicon was declared at all, so every browser fell
         back to an automatic /favicon.ico request that this app never
         serves -- a harmless but real 404 on every single page load,
         confirmed live. An inline data-URI SVG avoids adding a binary
         asset file for a one-letter mark; mirrors codegen.ts's own
         renderIconSvg (rounded square, white initial) for the exported
         apps, using this app's own --accent color (#bf5626, styles.css)
         instead of the generated-app orange. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23bf5626'/%3E%3Ctext x='96' y='99' text-anchor='middle' dominant-baseline='central' font-family='-apple-system,Segoe UI,Roboto,sans-serif' font-size='104' font-weight='700' fill='%23fff'%3EF%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
    />
    <title>Forge AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
